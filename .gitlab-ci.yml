stages:
  - test
  - image
  - release
  - gitops

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"
  GITOPS_REPOSITORY: "gitlab.com/lime985340/gitops.git"
  VITE_API_BASE_URL: "/atmo/api/v1"

.default_docker:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  before_script:
    - until docker info; do sleep 2; done
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

test:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run build

build_images:
  stage: image
  extends: .default_docker
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never
  script:
    - |
      export IMAGE_TAG="$CI_COMMIT_SHA"
      docker build \
        --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" \
        --build-arg VITE_KAKAO_APP_KEY="$VITE_KAKAO_APP_KEY" \
        -t "$CI_REGISTRY_IMAGE:$IMAGE_TAG" .
      docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"

promote_release:
  stage: release
  image: docker:27.5.1-cli
  needs: ["test"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
    - when: never
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - |
      source_tag="$CI_COMMIT_SHA"
      release_tag="$CI_COMMIT_TAG"
      docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$source_tag" --format '{{.Manifest.Digest}}'
      docker buildx imagetools create --prefer-index=false \
        --tag "$CI_REGISTRY_IMAGE:$release_tag" \
        "$CI_REGISTRY_IMAGE:$source_tag"
      source_digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$source_tag" --format '{{.Manifest.Digest}}')"
      release_digest="$(docker buildx imagetools inspect "$CI_REGISTRY_IMAGE:$release_tag" --format '{{.Manifest.Digest}}')"
      test "$source_digest" = "$release_digest"

update_gitops_dev:
  stage: gitops
  image: alpine:3.20
  needs: ["build_images"]
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $GITOPS_PUSH_TOKEN && $GITOPS_PUSH_TOKEN_USER'
    - when: never
  script:
    - |
      set -eu
      : "${GITOPS_BRANCH:?GITOPS_BRANCH must be configured in the lime Group}"
      case "$GITOPS_BRANCH" in
        feature/clean-gitops-layout|main) ;;
        *) echo "Unsupported GitOps branch: $GITOPS_BRANCH" >&2; exit 1 ;;
      esac
      apk add --no-cache git
      askpass_file="$(mktemp)"
      cleanup() { rm -f "$askpass_file"; }
      trap cleanup EXIT INT TERM
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "${1-}" in
        *[Uu]sername*) printf '%s\n' "$GITOPS_PUSH_TOKEN_USER" ;;
        *[Pp]assword*) printf '%s\n' "$GITOPS_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0
      export LC_ALL=C
      unset GIT_TRACE GIT_TRACE2 GIT_TRACE_CURL GIT_CURL_VERBOSE
      for attempt in 1 2 3; do
        rm -rf gitops
        git -c credential.helper= -c http.followRedirects=false \
          clone --branch "$GITOPS_BRANCH" "https://${GITOPS_REPOSITORY}" gitops
        cd gitops
        APPLICATION=atmo IMAGE_TAG="$CI_COMMIT_SHA" WORKLOAD=web ENVIRONMENT=dev sh ci/update-image-tag.sh
        git config user.name "gitlab-ci[bot]"
        git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
        git add workloads/atmo/web/environments/dev/kustomization.yaml
        if git diff --cached --quiet; then echo "GitOps tag is already up to date"; exit 0; fi
        git commit -m "chore: deploy atmo-web dev $CI_COMMIT_SHA"
        if git -c credential.helper= -c http.followRedirects=false push origin "HEAD:$GITOPS_BRANCH"; then
          exit 0
        fi
        cd ..
        echo "GitOps branch changed while pushing; retrying ($attempt/3)" >&2
      done
      echo "GitOps push failed after 3 attempts" >&2
      exit 1

update_gitops_prod:
  stage: gitops
  image: alpine:3.20
  needs: ["promote_release"]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/ && $GITOPS_PUSH_TOKEN && $GITOPS_PUSH_TOKEN_USER'
    - when: never
  script:
    - |
      set -eu
      : "${GITOPS_BRANCH:?GITOPS_BRANCH must be configured in the lime Group}"
      case "$GITOPS_BRANCH" in
        feature/clean-gitops-layout|main) ;;
        *) echo "Unsupported GitOps branch: $GITOPS_BRANCH" >&2; exit 1 ;;
      esac
      apk add --no-cache git
      askpass_file="$(mktemp)"
      cleanup() { rm -f "$askpass_file"; }
      trap cleanup EXIT INT TERM
      cat > "$askpass_file" <<'ASKPASS'
      #!/bin/sh
      case "${1-}" in
        *[Uu]sername*) printf '%s\n' "$GITOPS_PUSH_TOKEN_USER" ;;
        *[Pp]assword*) printf '%s\n' "$GITOPS_PUSH_TOKEN" ;;
        *) exit 1 ;;
      esac
      ASKPASS
      chmod 700 "$askpass_file"
      export GIT_ASKPASS="$askpass_file"
      export GIT_TERMINAL_PROMPT=0
      export LC_ALL=C
      unset GIT_TRACE GIT_TRACE2 GIT_TRACE_CURL GIT_CURL_VERBOSE
      for attempt in 1 2 3; do
        rm -rf gitops
        git -c credential.helper= -c http.followRedirects=false \
