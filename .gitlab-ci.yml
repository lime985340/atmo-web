stages:
  - test
  - docker

variables:
  DOCKER_TLS_CERTDIR: ""
  DOCKER_BUILDKIT: "1"

.default_docker:
  image: docker:24.0.9
  services:
    - name: docker:24.0.9-dind
      command: ["--tls=false"]
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"

build:
  stage: test
  image: node:20-alpine
  script:
    - npm ci
    - npm run build

docker:dev:
  stage: docker
  extends: .default_docker
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
  script:
    - IMAGE_TAG="dev-$(echo "$CI_COMMIT_SHA" | cut -c1-7)"
    - docker build --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" --build-arg VITE_KAKAO_APP_KEY="$VITE_KAKAO_APP_KEY" -t "$CI_REGISTRY_IMAGE:${IMAGE_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE:${IMAGE_TAG}"

docker:release:
  stage: docker
  extends: .default_docker
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - IMAGE_TAG="$CI_COMMIT_TAG"
    - docker build --build-arg VITE_API_BASE_URL="$VITE_API_BASE_URL" --build-arg VITE_KAKAO_APP_KEY="$VITE_KAKAO_APP_KEY" -t "$CI_REGISTRY_IMAGE:${IMAGE_TAG}" .
    - docker push "$CI_REGISTRY_IMAGE:${IMAGE_TAG}"
