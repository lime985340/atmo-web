        cd gitops
        APPLICATION=atmo IMAGE_TAG="$CI_COMMIT_TAG" WORKLOAD=web ENVIRONMENT=prod sh ci/update-image-tag.sh
        git config user.name "gitlab-ci[bot]"
        git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
