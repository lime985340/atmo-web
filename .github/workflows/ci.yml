name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_API_BASE_URL: /atmo/api/v1

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Verify API path is in the built bundle
        run: grep -R -F -q "/atmo/api/v1" dist/assets || (echo "The built bundle must contain /atmo/api/v1" >&2; exit 1)
