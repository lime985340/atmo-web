name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional vMAJOR.MINOR.PATCH tag to request a production GitOps PR (image must already exist in GHCR)"
        required: false
        type: string
      deploy_dev:
        description: "Manually deploy the latest already-published main SHA to dev"
        required: false
        type: boolean
        default: false
      oci_multiarch:
        description: "Publish a multiarch image for OCI Osaka without running verify tasks"
        required: false
        type: boolean
        default: false
      oci_source_ref:
        description: "Branch, tag, or commit to package"
        required: false
        type: string
        default: main
      oci_environment:
        description: "Application build profile"
        required: false
        type: choice
        options: [dev, prod]
        default: dev
      oci_image_tag:
        description: "Destination OCI image tag"
        required: false
        type: string
        default: oci-manual

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.oci_multiarch == true) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build dev variant and verify its public paths
        run: |
          VITE_BASE_PATH=/dev/atmo/ VITE_API_BASE_URL=/dev/atmo/api/v1 npm run build
          grep -R -F -q "/dev/atmo/api/v1" dist/assets
          grep -F -q '"/dev/atmo/assets/' dist/index.html
      - name: Build production variant and verify its public paths
        run: |
          VITE_BASE_PATH=/atmo/ VITE_API_BASE_URL=/atmo/api/v1 npm run build
          grep -R -F -q "/atmo/api/v1" dist/assets
          grep -F -q '"/atmo/assets/' dist/index.html

  publish-oci-multiarch:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.oci_multiarch == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.oci_source_ref }}
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build architecture-independent artifacts natively
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("Dockerfile")
          lines = path.read_text().splitlines()
          changed = False
          for index, line in enumerate(lines):
              if line.startswith("FROM ") and " AS build" in line and not line.startswith("FROM --platform="):
                  lines[index] = line.replace("FROM ", "FROM --platform=$BUILDPLATFORM ", 1)
                  changed = True
          if not changed:
              raise SystemExit("No architecture-independent build stage found")
          path.write_text(chr(10).join(lines) + chr(10))
          PY
      - name: Require the Kakao web key
        env:
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}
        run: test -n "$VITE_KAKAO_APP_KEY"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish OCI multiarch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/lime985340/atmo-web:${{ inputs.oci_image_tag }}
          build-args: |
            VITE_API_BASE_URL=${{ inputs.oci_environment == 'prod' && '/atmo/api/v1' || '/dev/atmo/api/v1' }}
            VITE_BASE_PATH=${{ inputs.oci_environment == 'prod' && '/atmo/' || '/dev/atmo/' }}
            VITE_KAKAO_APP_KEY=${{ secrets.VITE_KAKAO_APP_KEY }}

  publish-ghcr:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Check semantic version tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only vMAJOR.MINOR.PATCH release tags are supported." >&2
            exit 1
          fi
      - name: Require the Kakao web key
        env:
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}
        run: test -n "$VITE_KAKAO_APP_KEY"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lime985340/atmo-web
          tags: |
            type=raw,value=${{ github.sha }}
            type=ref,event=tag
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=${{ startsWith(github.ref, 'refs/tags/v') && '/atmo/api/v1' || '/dev/atmo/api/v1' }}
            VITE_BASE_PATH=${{ startsWith(github.ref, 'refs/tags/v') && '/atmo/' || '/dev/atmo/' }}
            VITE_KAKAO_APP_KEY=${{ secrets.VITE_KAKAO_APP_KEY }}

  update-gitops:
    if: ${{ always() && needs.verify.result == 'success' && ((github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish-ghcr.result == 'success' && vars.GHCR_DEPLOY_DEV_ENABLED == 'true') || ((github.event_name == 'workflow_dispatch' && inputs.deploy_dev == true && github.ref == 'refs/heads/main' && vars.GHCR_DEPLOY_DEV_ENABLED == 'true') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && vars.GHCR_DEPLOY_PROD_ENABLED == 'true'))) }}
    needs: [verify, publish-ghcr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PLATFORM_GITOPS_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
      GH_TOKEN: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
      APPLICATION: atmo
      WORKLOAD: web
      IMAGE_NAME: ghcr.io/lime985340/atmo-web
      IMAGE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.sha }}
      IMAGE_ENVIRONMENT: ${{ inputs.release_tag != '' && 'prod' || 'dev' }}
    steps:
      - name: Require the GitOps token
        run: |
          if [ -z "$PLATFORM_GITOPS_TOKEN" ]; then
            echo "::error::Add PLATFORM_GITOPS_TOKEN to this repository. It needs Contents: read/write and Pull requests: read/write on lime985340/platform-gitops."
            exit 1
          fi
      - name: Log in to GHCR for release image verification
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.deploy_dev == true) }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check that the manually selected image exists
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.release_tag != '' || inputs.deploy_dev == true) }}
        run: |
          set -eu
          if [ "$IMAGE_ENVIRONMENT" = prod ]; then
            printf '%s' "$IMAGE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' || {
              echo "::error::Use a release tag in vMAJOR.MINOR.PATCH format."
              exit 1
            }
          else
            printf '%s' "$IMAGE_TAG" | grep -Eq '^[a-f0-9]{40}$' || {
              echo "::error::The dev deployment must use a full commit SHA."
              exit 1
            }
          fi
          docker manifest inspect "$IMAGE_NAME:$IMAGE_TAG" >/dev/null
        env:
          IMAGE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.sha }}
      - name: Check out GitHub GitOps
        uses: actions/checkout@v4
        with:
          repository: lime985340/platform-gitops
          ref: main
          token: ${{ secrets.PLATFORM_GITOPS_TOKEN }}
          path: platform-gitops
      - name: Update dev directly or open a production deployment PR
        run: |
          set -eu
          cd platform-gitops
          APPLICATION="$APPLICATION" WORKLOAD="$WORKLOAD" ENVIRONMENT="$IMAGE_ENVIRONMENT" IMAGE_TAG="$IMAGE_TAG" sh ci/update-image-tag.sh

          if [ "$APPLICATION" = q-interior ]; then
            overlay="workloads/q-interior/$WORKLOAD/environments/$IMAGE_ENVIRONMENT/kustomization.yaml"
            sed -i -E 's/^([[:space:]]+count:).*/\1 1/' "$overlay"
          fi

          git add "workloads/$APPLICATION/$WORKLOAD/environments/$IMAGE_ENVIRONMENT/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "GitOps already points to $IMAGE_TAG in $IMAGE_ENVIRONMENT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "chore: deploy $APPLICATION $WORKLOAD $IMAGE_ENVIRONMENT $IMAGE_TAG"

          if [ "$IMAGE_ENVIRONMENT" = prod ]; then
            branch_name="deploy/${APPLICATION}-${WORKLOAD}-${IMAGE_TAG}"
            git checkout -B "$branch_name"
            git push --force-with-lease origin "HEAD:$branch_name"
            pull_request_url="$(gh pr list --repo lime985340/platform-gitops --head "$branch_name" --state open --json url --jq '.[0].url // empty')"
            if [ -n "$pull_request_url" ]; then
              echo "Updated existing production deployment PR: $pull_request_url"
            else
              gh pr create --repo lime985340/platform-gitops --base main --head "$branch_name" --title "deploy: $APPLICATION $WORKLOAD prod $IMAGE_TAG" --body "A production image was published from the $IMAGE_TAG release tag. Review and merge this GitOps PR to start deployment."
            fi
            exit 0
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Could not update platform-gitops/main after 5 push attempts" >&2
          exit 1
